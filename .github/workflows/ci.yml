name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck over the bench's scripts
        run: shellcheck -x -P bench bench/*.sh bench/fixtures/*.sh

  tests:
    # The script tests edit their fixtures with BSD sed, so they run on macOS.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The writing rules, over every page
        run: ./tools/check-prose.sh
      - name: The test of the writing check
        run: bash tools/check-prose.test.sh
      - name: GNU timeout, which the bench's launcher bounds a run with
        run: brew install coreutils
      - name: Every script test of the bench, on its captured runs
        run: |
          ran=0 failed=0
          for t in bench/*.test.sh; do
            # Two of its cases need four cells side by side, which takes a host of eight cores.
            if [ "$t" = bench/battery.test.sh ]; then echo "$t: not run on this runner"; continue; fi
            ran=$((ran + 1))
            echo "::group::$t"
            bash "$t" || { failed=$((failed + 1)); echo "::error file=$t::$t failed"; }
            echo "::endgroup::"
          done
          echo "$ran script tests, $failed failed"
          [ "$ran" -gt 0 ] && [ "$failed" -eq 0 ]
